<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Панель обмена подарками</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <div class="top-title" id="title">Обмен подарками</div>
      <div class="top-sub" id="subtitle">Загрузка…</div>
    </div>
    <button class="icon-btn" id="refresh" type="button" aria-label="Обновить">⟳</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="overview" type="button" role="tab">Обзор</button>
    <button class="tab" data-tab="families" type="button" role="tab">Семьи</button>
    <button class="tab" data-tab="gifts" type="button" role="tab">Подарки</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab-panel"></section>
    <section id="tab-families" class="tab-panel" hidden></section>
    <section id="tab-gifts" class="tab-panel" hidden></section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
