# Local development: MySQL plus the bot built from source.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: kids_gift_exchange
      MYSQL_USER: kids_gift_exchange
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret", "--silent"]
      interval: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  bot:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
