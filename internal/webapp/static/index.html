<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Панель обмена подарками</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-text">
      <div class="top-title" id="title">Обмен подарками</div>
      <div class="top-sub" id="subtitle">Загрузка…</div>
    </div>
    <button class="icon-btn" id="refresh" type="button" aria-label="Обновить">⟳</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-section="exchanges" type="button" role="tab">Обмены</button>
    <button class="tab" data-section="people" type="button" role="tab">Люди</button>
  </nav>

  <main id="view"></main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
